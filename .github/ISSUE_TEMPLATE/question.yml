# Maintainers: Keep rule and Security links aligned with docs/FeedbackRule_QA-SI.md.
name: Question / clarification
description: Ask how a server system or feature works.
body:
  - type: markdown
    attributes:
      value: |
        Read the [feedback rules](https://github.com/SchemaFoxLabs/NetherMC/blob/main/docs/FeedbackRule_QA-SI.md) and provide enough context to understand your question.

        For vulnerabilities or exploitable issues, use the [Security page](https://github.com/SchemaFoxLabs/NetherMC/security) and select **Report a vulnerability**. If unavailable, ask only for a private contact method; do not disclose vulnerability details publicly.
  - type: input
    id: affected_area
    attributes:
      label: System or feature
      description: Identify the server and the system or feature you are asking about.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What is unclear?
      description: Explain what you would like staff to clarify.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant actions or context
      description: Describe what you were doing and the circumstances behind your question.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Instructions already consulted (optional)
      description: Link or describe any instructions you have read.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Attach relevant screenshots after removing private information.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I have read the feedback rules.
          required: true
        - label: I have provided a specific question and relevant context.
          required: true
        - label: I have removed personal or private information and am not publicly disclosing a security vulnerability.
          required: true
